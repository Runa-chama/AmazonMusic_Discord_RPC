# Amazon Music Discord RPC - 設定ファイルの例
#
# このファイルをコピーして config.ini にリネームしても使えますが、
# 通常は exe を初回起動したときに自動生成される config.ini を編集してください。

# Discord Developer Portal (https://discord.com/developers/applications) で
# アプリを作成し、Application ID を貼り付けてください。
# アプリ名は Discord のアクティビティ名として使われます。
client_id=

# 対象アプリの判定（セミコロン区切り / 大文字小文字を無視した部分一致）
# 空欄にすると、すべてのメディアセッションが対象になります。
#   Amazon Music デスクトップ : amazon
#   ブラウザ版                 : chrome;msedge;firefox
app_filter=amazon

# ジャケット画像の取得方法
#   itunes : iTunes Search API から検索（アップロードなし）
#   catbox : Amazon Music の通知画像を catbox.moe にアップロード（完全一致・公開 URL）
#   none   : 画像なし
art_source=itunes

# iTunes 検索のストア（JP, US など）
art_country=JP

# 名前の下のステータス行に表示する項目
#   details : 曲名（おすすめ）
#   state   : アーティスト
#   name    : Discord アプリ名
status_display=details

# メディア情報のポーリング間隔（ミリ秒 / 250〜5000）
poll_ms=750

# 一時停止中もプロフィールに表示する
show_paused=true

# Discord Rich Presence を有効にする（トレイメニューからも切り替え可能）
rpc_enabled=true
